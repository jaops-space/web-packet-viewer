[package]
name = "pv-core"
version = "0.1.0"
edition = "2021"
description = "Yamcs packet viewer core: packet splitting, preprocessing, decoding, display filter"

[dependencies]
xtce-rs = { path = "../../xtce-rs" }
regex-lite = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
self_cell = "1"

[dev-dependencies]
hex = "0.4"
